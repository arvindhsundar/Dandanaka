# Dokploy "Compose" deployment on the puttheplayerfirst.com VPS.
# nginx (the static site's container) proxies /soundboard/ to this container by name
# over the shared dokploy-network, exactly like the PhotoQuest prompt proxy.
services:
  dandanaka:
    build: .
    container_name: dandanaka
    restart: unless-stopped
    environment:
      - PORT=3000
      - BASE_PATH=/soundboard
      # Sounds imported outside the repo (e.g. Pixabay). Create the dir on the box and
      # run scripts/import-sounds.mjs with --dest pointing at it; empty dir is fine.
      - EXTRA_SOUNDS_DIR=/data/sounds
    volumes:
      - /srv/dandanaka/sounds:/data/sounds:ro
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true
