# Paste into the main server{} block of server/nginx.conf in puttheplayerfirst-site,
# next to the PhotoQuest proxy (it reuses that block's `resolver 127.0.0.11`).
#
# Soundboard (Dandanaka): whole prefix -> standalone node container on dokploy-network.
# WebSocket upgrade headers are required; without them the board loads but never connects.
location = /soundboard { return 301 /soundboard/; }
location /soundboard/ {
    set $sb_upstream dandanaka;
    rewrite ^/soundboard/(.*)$ /$1 break;
    proxy_pass http://$sb_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;   # long-lived websockets; the app pings every 30s
}
